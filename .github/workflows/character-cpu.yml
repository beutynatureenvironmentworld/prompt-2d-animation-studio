name: Character motion and CPU background
on:
  workflow_dispatch:
    inputs:
      motion:
        description: Describe a four-second character movement
        required: true
        default: A person ducks then jumps back in surprise
      setting:
        description: Scene for prop physics and dialogue
        type: choice
        options: [rooftop, garden, workshop]
      art:
        description: Background renderer
        type: choice
        options: [blender, experimental-diffusion]
      background:
        description: Background art prompt
        required: true
        default: A moonlit cartoon rooftop with a warm glowing window, no people
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SETTING: ${{ inputs.setting || 'rooftop' }}
      MOTION: ${{ inputs.motion || 'A person ducks then jumps back in surprise' }}
      BACKGROUND: ${{ inputs.background || 'Moonlit cartoon rooftop with a warm glowing window, no people' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare official Blender and CPU motion runtime
        run: |
          mkdir -p output worker-bin
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          curl -fsSL --retry 3 https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz | tar xJ -C worker-bin
          echo "$PWD/worker-bin/blender-4.2.0-linux-x64" >> "$GITHUB_PATH"
          bash motion-worker/install.sh
      - name: Export reusable body motion
        run: BVH_BLENDER=/usr/bin/blender python3 motion-worker/prepare.py "$MOTION" output/character
      - name: Render CPU lighting plate
        if: ${{ !cancelled() }}
        run: blender -b -t 2 --python-exit-code 1 -P motion-worker/cycles_plate.py -- output/cycles.png
      - name: Install stable-diffusion.cpp CPU and generate background
        if: ${{ !cancelled() && inputs.art == 'experimental-diffusion' }}
        run: |
          git clone --depth 1 https://github.com/leejet/stable-diffusion.cpp.git worker-bin/sd
          git -C worker-bin/sd submodule update --init --recursive --depth 1
          cmake -S worker-bin/sd -B worker-bin/build -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON
          cmake --build worker-bin/build --config Release -j 2 --target sd-cli
          curl -fL --retry 3 https://huggingface.co/gpustack/stable-diffusion-v2-1-turbo-GGUF/resolve/1316499/stable-diffusion-v2-1-turbo-Q4_0.gguf -o worker-bin/turbo.gguf
          export SD_BIN="$PWD/worker-bin/build/bin/sd-cli" SD_MODEL="$PWD/worker-bin/turbo.gguf"
          bash motion-worker/cpu-background.sh "$BACKGROUND" output/diffusion.png
      - name: Composite character, plate, physics and audio into the episode
        if: ${{ !cancelled() && hashFiles('output/character/pose.json') != '' }}
        run: |
          set -eu
          sudo apt-get install -y --no-install-recommends python3-cairo ffmpeg
          npm install --prefix kinetic-studio --ignore-scripts --no-audit --no-fund
          PLATE=output/diffusion.png
          if [ ! -s "$PLATE" ]; then PLATE=output/cycles.png; fi
          python3 - <<'PYTHON'
          import json, os
          plan = dict(prompt=os.environ["MOTION"], place=os.environ["SETTING"], prop="clock",
                      move="drop", reaction="jump", camera="wide", tone="night")
          with open("output/scene.json", "w") as out:
              json.dump(plan, out)
          PYTHON
          /usr/bin/python3 kinetic-studio/film.py "$MOTION" output/episode --motion-clip output/character --cached-plan output/scene.json --background-plate "$PLATE" --width 540
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cpu-motion-and-plates
          path: output/

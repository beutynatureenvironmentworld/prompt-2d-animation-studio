name: ShortGPT SuperTest REAL Open-Weights CPU AI (Qwen3 + SSD-1B)
on:
  push:
    branches: [experiment/shortgpt-supertest-hf-oracle]
    paths:
      - 'shortgpt-supertest/models/**'
      - '.github/workflows/shortgpt-openweights-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shortgpt-openweights-${{ github.ref }}
  cancel-in-progress: false
jobs:
  local-qwen3-json:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install actual llama.cpp Python CPU runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel
          CMAKE_ARGS='-DGGML_CUDA=OFF' python -m pip install --no-cache-dir 'llama-cpp-python>=0.3.16,<0.4' 'huggingface_hub>=0.34,<2' 'Pillow>=10.3,<12'
      - name: Download Apache-2.0 Qwen3-4B GGUF (~2.5 GB) and perform REAL LLM JSON inference
        run: |
          cd shortgpt-supertest
          python -m unittest discover -s tests -v
          python models/offline_inference.py story \
            --prompt 'A funny boy runs to the toilet, knocks, the door is locked, and he panics and recovers' \
            --max-tokens 500 --output output/Qwen3-Actual-AI-Story.json
          python - <<'PY'
          import json
          from shortgpt_supertest import safe_plan
          d=json.load(open('output/Qwen3-Actual-AI-Story.json'))
          print('GENUINE_QWEN3_4B_CPU_STORY_INFERENCE_PASS',len(safe_plan(d)['scenes']), 'scenes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-qwen3-local-cpu-story-json
          path: shortgpt-supertest/output/Qwen3-Actual-AI-Story.json
          if-no-files-found: warn
          retention-days: 7
  local-ssd1b-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify disk and CPU RAM before downloading model
        run: |
          df -h .; free -h
      - name: Install REAL CPU PyTorch without CUDA packages
        run: |
          python -m pip install --no-cache-dir 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install Apache-2.0 Segmind SSD-1B actual Diffusers inference dependencies
        run: |
          python -m pip install --no-cache-dir 'diffusers==0.35.2' 'transformers==4.57.1' 'accelerate==1.12.0' 'huggingface_hub>=0.34,<1' 'safetensors>=0.4' 'Pillow>=10.3,<12' 'sentencepiece'
          python - <<'PY'
          import torch,diffusers,transformers,huggingface_hub
          print('ACTUAL_OPEN_SOURCE_IMAGE_RUNTIME_INSTALLED',torch.__version__,diffusers.__version__,transformers.__version__)
          PY
      - name: Download only required FP16 SSD-1B components (~4.5 GB), then run REAL CPU image diffusion
        run: |
          cd shortgpt-supertest
          python models/offline_inference.py image \
            --prompt 'Original high quality 2D cel-shaded funny cartoon bathroom hallway, olive grey ink outlines, cheerful yellow light, closed wooden door, wide composition, consistent environment, no characters, no text' \
            --width 320 --height 448 --steps 5 --output output/Segmind-SSD1B-Actual-CPU-Image.png
          python - <<'PY'
          from PIL import Image,ImageStat
          p='output/Segmind-SSD1B-Actual-CPU-Image.png'
          im=Image.open(p).convert('RGB')
          std=ImageStat.Stat(im).stddev
          assert im.size==(320,448) and max(std)>15
          print('GENUINE_SSD_1B_LOCAL_CPU_DIFFUSION_PASS',im.size,std)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-segmind-ssd1b-cpu-generated-image
          path: shortgpt-supertest/output/Segmind-SSD1B-Actual-CPU-Image.png
          if-no-files-found: warn
          retention-days: 7

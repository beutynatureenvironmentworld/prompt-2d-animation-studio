name: Render procedural bedroom short
on: workflow_dispatch
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg librsvg2-2
      - run: python3 render.py story.json short.mp4
        working-directory: midnight-jar
      - uses: actions/upload-artifact@v4
        with:
          name: the-snore-collector
          path: midnight-jar/short.mp4
          retention-days: 3

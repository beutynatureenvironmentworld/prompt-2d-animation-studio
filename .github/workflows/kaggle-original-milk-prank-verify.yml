name: FTE Kaggle Reference-Style Milk Prank — Verified Existing MP4
on:
  push:
    branches: [feature/milk-prank-original-midnight-engine-20261119]
    paths: ['.github/workflows/kaggle-original-milk-prank-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-existing-completed-kaggle-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_ID: gamagekasun/fte-snore-engine-milk-prank-44469101475
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client and ffprobe verifier, no GPU submission
        run: |
          set -euo pipefail
          python -m pip install -q 'kaggle>=1.7,<2' 'six>=1.16,<2' 'Pillow>=10,<13'
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffprobe
          mkdir -p output
      - name: Read completed Kaggle job and download authentic MP4 (no new job)
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels status "$KERNEL_ID" | tee output/KAGGLE_STATUS.txt
          grep -q 'KernelWorkerStatus.COMPLETE' output/KAGGLE_STATUS.txt
          kaggle kernels output "$KERNEL_ID" \
            --file-pattern 'RESULT\.json$|Funny_Toon_Ever_Milk_Prank_Kaggle_Original_Engine\.mp4$' \
            -p output | tee output/KAGGLE_COLLECT_LOG.txt
      - name: Independently verify genuine vertical Kaggle MP4, restore original manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from PIL import Image
          root=Path('output')
          mfile=next(root.rglob('RESULT.json'),None)
          video=next(root.rglob('Funny_Toon_Ever_Milk_Prank_Kaggle_Original_Engine.mp4'),None)
          assert mfile and video, 'Kaggle MP4 or manifest missing'
          raw=mfile.read_text()
          if raw.endswith('\\n'):
            raw=raw[:-2]  # Existing completed Kaggle worker wrote literal backslash-n.
          m=json.loads(raw)
          assert m.get('status')=='completed'
          assert m.get('video_verified') is True
          assert m.get('gpu_requested') is False
          assert m.get('engine')=='original Snore Collector SVG+librsvg+FFmpeg'
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams',
                     '-show_format','-of','json',str(video)],text=True))
          v=next(a for a in p['streams'] if a['codec_type']=='video')
          has_audio=any(a['codec_type']=='audio' for a in p['streams'])
          length=float(p['format']['duration'])
          verified=v['codec_name']=='h264' and v['width']==1080 and v['height']==1920 and has_audio and 14.8<=length<=15.3
          qa={'source':'gamagekasun/fte-snore-engine-milk-prank-44469101475',
              'verified':verified,'duration':length,'width':v['width'],
              'height':v['height'],'audio':has_audio,'bytes':video.stat().st_size,
              'render_method':'real Kaggle CPU execution of original Snore Collector SVG engine',
              'h3_inference_verified':False,
              'note':'Verified encode and source identity; creative timing and art still need user judgment'}
          (root/'COLLECTION_QA.json').write_text(json.dumps(qa,indent=2)+'\n')
          print('KAGGLE_GENUINE_ORIGINAL_STYLE_QA',qa,flush=True)
          assert verified,'Actual video/audio/duration QA failed'
          frames=[]
          for i,t in enumerate((1,3,5,7.5,9.6,12.6)):
            dst=root/f'contact_{i}.png'
            subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',str(t),
              '-i',str(video),'-frames:v','1',str(dst)],check=True)
            image=Image.open(dst).convert('RGB');image.thumbnail((170,302))
            frames.append(image)
            dst.unlink()
          contact=Image.new('RGB',(170*6,302),'#f6f4ee')
          for i,image in enumerate(frames):contact.paste(image,(i*170,0))
          contact.save(root/'REFERENCE_STYLE_FRAME_QA.jpg',quality=86)
          PY
      - name: Upload validated Kaggle MP4, proof JSON and real frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FTE-Kaggle-Original-Snore-Style-Milk-Prank-VERIFIED
          path: output/
          retention-days: 30
          if-no-files-found: warn

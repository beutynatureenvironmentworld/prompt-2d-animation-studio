name: Slapstick Studio — Original Sprite Animation Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'slapstick-studio/**'
      - '.github/workflows/slapstick-studio-demo.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU animation stack
        run: |
          python -m pip install -r slapstick-studio/requirements.txt
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Generate original modular PNG sprites
        run: python slapstick-studio/studio.py assets
      - name: Render actual portrait H264 1080p video
        run: python slapstick-studio/studio.py render
      - name: Decode MP4 and validate motion
        run: python slapstick-studio/studio.py verify
      - name: Upload actual demo and quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slapstick-studio-original-sprite-demo
          path: |
            slapstick-studio/out/*
            slapstick-studio/story.json
            slapstick-studio/assets/poses/*.png
            slapstick-studio/assets/poses/manifest.json
          retention-days: 14
          if-no-files-found: warn

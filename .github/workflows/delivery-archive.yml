name: Prepare private video support storage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['video-pilot/archive.py', '.github/workflows/delivery-archive.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'modal>=1,<2'
      - working-directory: video-pilot
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal run archive.py::prepare
          modal deploy archive.py

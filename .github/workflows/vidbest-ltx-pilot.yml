name: Stage the private vid.best render engine
on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Modal deployment target
        type: choice
        options:
          - primary
          - fallback
        default: primary
      confirmed_free_budget:
        description: I confirmed the workspace spending limit and remaining free compute credits
        required: true
        type: boolean
        default: false
jobs:
  stage:
    if: inputs.confirmed_free_budget && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    environment: ${{ inputs.workspace == 'fallback' && 'video-pilot-fallback' || 'video-pilot' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'modal>=1,<2'
      - name: Stage gated weights and deploy render function
        working-directory: video-pilot
        env:
          MODAL_TOKEN_ID: ${{ secrets[inputs.workspace == 'fallback' && 'MODAL_FALLBACK_TOKEN_ID' || 'MODAL_TOKEN_ID'] }}
          MODAL_TOKEN_SECRET: ${{ secrets[inputs.workspace == 'fallback' && 'MODAL_FALLBACK_TOKEN_SECRET' || 'MODAL_TOKEN_SECRET'] }}
        run: |
          set -eu
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          modal run engine.py::prepare_weights
          modal deploy engine.py

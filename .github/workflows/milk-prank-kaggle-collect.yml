name: FTE Milk Prank — Verify existing Kaggle MP4 (NO new render)
on:
  push:
    branches: [feature/kaggle-milk-prank-clear-20261118]
    paths: ['.github/workflows/milk-prank-kaggle-collect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-verify-real-kaggle-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_ID: gamagekasun/fte-clear-milk-prank-44372455419
    steps:
      - name: Install required QA and Kaggle client dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet 'kaggle>=1.7,<2' 'six>=1.16,<2'
          ffprobe -version | head -n 1
      - name: Read already completed Kaggle notebook and download genuine MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          kaggle kernels status "$KERNEL_ID" | tee output/KAGGLE_STATUS.txt
          if ! grep -q 'KernelWorkerStatus.COMPLETE' output/KAGGLE_STATUS.txt; then
            echo 'KAGGLE_JOB_NOT_COMPLETE'; exit 1
          fi
          kaggle kernels output "$KERNEL_ID" -p output --file-pattern 'RESULT\.json$|Funny_Toon_Ever_Clever_Milk_Prank_KAGGLE\.mp4$' | tee output/COLLECTION_LOG.txt
          find output -type f -maxdepth 3 -printf '%p (%s bytes)\n'
      - name: Validate actual vertical H264 MP4, audio, 2D method and duration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('output')
          movie=next(root.rglob('Funny_Toon_Ever_Clever_Milk_Prank_KAGGLE.mp4'),None)
          manifest=next(root.rglob('RESULT.json'),None)
          if not movie or not manifest:raise SystemExit('Kaggle MP4 or manifest missing')
          m=json.loads(manifest.read_text())
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(movie)],text=True))
          video=next(s for s in info['streams'] if s['codec_type']=='video')
          aud=any(s['codec_type']=='audio' for s in info['streams'])
          dur=float(info['format']['duration'])
          passed=(m['status']=='completed' and m['video_valid'] is True and
                  m['model']=='not MiniMax H3' and video['codec_name']=='h264' and
                  video['width']==720 and video['height']==1280 and dur>=11 and aud)
          qa={'passed':passed,'mp4':movie.name,'size_bytes':movie.stat().st_size,
              'width':video['width'],'height':video['height'],'duration':dur,
              'has_audio':aud,'codec':video['codec_name'],
              'render_source':'Kaggle original 2D vector animation, NOT MiniMax H3'}
          (root/'COLLECTION_QA.json').write_text(json.dumps(qa,indent=2)+'\n')
          print('KAGGLE_MP4_VERIFICATION',json.dumps(qa),flush=True)
          if not passed:raise SystemExit('Quality checks failed')
          PY
      - name: Publish verified original Kaggle MP4 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Funny-Toon-Ever-Clever-Milk-Prank-VERIFIED-KAGGLE-MP4
          path: output/
          retention-days: 30
          if-no-files-found: error
      - name: Preserve diagnostic files if validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FTE-Milk-Prank-Kaggle-QA-Diagnostics
          path: output/
          retention-days: 7
          if-no-files-found: warn

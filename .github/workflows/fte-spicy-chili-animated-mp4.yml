name: Funny Toon Ever — Spicy Chili Permanent Mascot MP4
on:
  push:
    branches: [feature/fte-spicy-chili-animated-mp4]
    paths:
      - 'mascot-lab/spicy-chili/**'
      - '.github/workflows/fte-spicy-chili-animated-mp4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spicy-cpu-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio and offline CPU animation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -r mascot-lab/spicy-chili/requirements.txt
      - name: Test script, IK, source identity and shoulder joins
        run: python -m unittest discover -s mascot-lab/spicy-chili/tests -v
      - name: Animate real permanent mascot source into H264/AAC MP4
        run: |
          python mascot-lab/spicy-chili/source/spicy_motion_director.py --out mascot-lab/spicy-chili/output/motion_plan.json
          python mascot-lab/spicy-chili/source/render_spicy.py \
            --reference mascot-lab/config/permanent_mascot.webp \
            --plan mascot-lab/spicy-chili/output/motion_plan.json \
            --out mascot-lab/spicy-chili/output/Funny_Toon_Ever_Spicy_Fire.mp4
          python mascot-lab/spicy-chili/source/qa_spicy.py \
            --video mascot-lab/spicy-chili/output/Funny_Toon_Ever_Spicy_Fire.mp4 \
            --metadata mascot-lab/spicy-chili/output/Funny_Toon_Ever_Spicy_Fire.json
      - name: Upload verified video and frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funny-Toon-Ever-Spicy-Chili-Actual-Animated-MP4
          path: |
            mascot-lab/spicy-chili/output/Funny_Toon_Ever_Spicy_Fire.mp4
            mascot-lab/spicy-chili/output/Funny_Toon_Ever_Spicy_Fire.json
            mascot-lab/spicy-chili/output/ACTUAL_SPICY_FRAMES.jpg
            mascot-lab/spicy-chili/output/motion_plan.json
            mascot-lab/spicy-chili/output/QA_VERIFIED.json
          if-no-files-found: warn
          retention-days: 7

name: FTE IK Rig Fast Smoke Test
on:
  push:
    branches: [feature/fte-milk-prank-ik-sound-studio-v2-20261119]
    paths: ['.github/workflows/fte-milk-prank-ik-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  js-ik-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check real original drawing, IK math, hand contact and feet
        run: |
          set -euo pipefail
          node --check milk-prank-original/art.cjs
          node --check milk-prank-original/rig_ik.cjs
          node milk-prank-original/test_ik.cjs
          mkdir -p milk-prank-original/out/preflight
          node - <<'JS' > milk-prank-original/out/preflight/IK_REPORT.json
          const m=require('./milk-prank-original/rig_ik.cjs');
          process.stdout.write(JSON.stringify({verified:true,joints:m.inspect(),
            method:"source-based analytic IK; real SVG generated but no MP4 in this smoke"},null,2)+'\n');
          JS
      - name: Keep actual numerical and SVG audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FTE-IK-Preflight-and-Joint-Contact-Report
          path: milk-prank-original/out/preflight/
          if-no-files-found: warn
          retention-days: 7

name: Verify fallback Modal credentials
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-modal-fallback.yml']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: video-pilot-fallback
    steps:
      - run: python -m pip install 'modal>=1,<2' --quiet
      - name: Check token format and authenticate
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_FALLBACK_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_FALLBACK_TOKEN_SECRET }}
        run: |
          [[ "$MODAL_TOKEN_ID" == ak-?* ]] || { echo 'Missing or invalid Token ID'; exit 1; }
          [[ "$MODAL_TOKEN_SECRET" == as-?* ]] || { echo 'Missing or invalid Token Secret'; exit 1; }
          modal app list --env main >/dev/null

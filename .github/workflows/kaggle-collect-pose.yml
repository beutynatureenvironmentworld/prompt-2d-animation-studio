name: Collect first private AI cartoon pose
on:
  push:
    branches: [feature/kaggle-30h-efficient-studio]
    paths: ['.github/workflows/kaggle-collect-pose.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-pose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      POSE_SLUG: vidbest-pose-ai-43740025155-c7ca1307
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private Kaggle AI generation status
        run: |
          mkdir -p kaggle-studio/pose-output
          test -n "$KAGGLE_API_TOKEN" && test -n "$KAGGLE_USERNAME" || {
            echo 'Kaggle auth missing'; exit 2
          }
          python -m pip install --quiet kaggle six
          kernel="$KAGGLE_USERNAME/$POSE_SLUG"
          for n in 1 2 3 4 5 6; do
            kaggle kernels status "$kernel" 2>&1 | tee kaggle-studio/pose-output/status.txt
            if grep -Eiq 'complete|success|failed|error|cancel' kaggle-studio/pose-output/status.txt; then
              break
            fi
            [ "$n" = 6 ] || sleep 15
          done
          if grep -Eiq 'complete|success' kaggle-studio/pose-output/status.txt; then
            kaggle kernels output "$kernel" -p kaggle-studio/pose-output -o
            test -s kaggle-studio/pose-output/original-cartoon-pose.png
            test -s kaggle-studio/pose-output/gpu-studio-result.json
            python - <<'PY'
          import json
          d=json.load(open('kaggle-studio/pose-output/gpu-studio-result.json'))
          assert d['cuda_verified'] and d['model_inference_verified']
          print('REAL_AI_CARTOON_POSE_PASS:',d['model'],d['elapsed_seconds'],'sec',d['devices'])
          PY
          elif grep -Eiq 'failed|error|cancel' kaggle-studio/pose-output/status.txt; then
            echo 'Kaggle AI pose job failed. Inspect Kaggle private notebook logs.'
            kaggle kernels logs "$kernel" 2>&1 | tail -90 > kaggle-studio/pose-output/private-kernel-log-tail.txt || true
            exit 1
          else
            echo 'Kaggle AI pose still pending. No completion claim.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-real-ai-pose-evidence
          path: kaggle-studio/pose-output/
          retention-days: 7
          if-no-files-found: warn

name: Assemble verified GPU Puppy Video
on:
  push:
    branches: [puppy-yarn-ltx23-real-gpu-20261124]
    paths:
      - '.github/workflows/assemble-puppy-gpu-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Restore actual LTX video file from audited base64 binary parts
        run: |
          set -eu
          mkdir -p demos
          cat gpu-archive/video.part1.b64 gpu-archive/video.part2.b64 | base64 --decode > demos/FunnyToonEver_Puppy_LTX23_GPU_Hybrid_6s_9x16.mp4
          echo "5bdcb14e6548612d6461fd56e41cff1f6acb988fa3ca25f4bd4b91b630bebabc  demos/FunnyToonEver_Puppy_LTX23_GPU_Hybrid_6s_9x16.mp4" | sha256sum --check
          test "$(stat -c %s demos/FunnyToonEver_Puppy_LTX23_GPU_Hybrid_6s_9x16.mp4)" -eq 134480
      - name: Verify actual H264 video stream and audio
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -of compact demos/FunnyToonEver_Puppy_LTX23_GPU_Hybrid_6s_9x16.mp4
          ffmpeg -v error -i demos/FunnyToonEver_Puppy_LTX23_GPU_Hybrid_6s_9x16.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: FunnyToonEver-Real-LTX23-Puppy-MP4
          path: demos/FunnyToonEver_Puppy_LTX23_GPU_Hybrid_6s_9x16.mp4
          retention-days: 30
      - name: Publish download file to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/FunnyToonEver_Puppy_LTX23_GPU_Hybrid_6s_9x16.mp4
          git commit -m "Publish verified real LTX GPU animated puppy portrait video"
          git push origin "HEAD:puppy-yarn-ltx23-real-gpu-20261124"

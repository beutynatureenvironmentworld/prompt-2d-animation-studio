name: Hybrid video GPU
on:
  workflow_dispatch:
    inputs:
      model:
        type: choice
        options: [ltx, wan, toon]
        required: true
      bundle:
        description: Path to a prepared episode ZIP in this repository
        required: true
permissions:
  contents: read
jobs:
  kaggle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dispatch private Kaggle GPU notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          OWNER: ${{ vars.KAGGLE_USERNAME }}
          BUNDLE: ${{ inputs.bundle }}
          MODEL: ${{ inputs.model }}
        run: |
          test -n "$KAGGLE_API_TOKEN" && test -n "$OWNER" || { echo 'Configure KAGGLE_API_TOKEN and KAGGLE_USERNAME in this repository first.'; exit 1; }
          case "$(realpath -e -- "$BUNDLE")" in "$GITHUB_WORKSPACE"/*.zip) ;; *) exit 1;; esac
          pip install kaggle
          python hybrid-gpu/kaggle_job.py "$BUNDLE" "$OWNER" --model "$MODEL"

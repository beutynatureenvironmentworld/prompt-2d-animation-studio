name: ShortGPT Original Full CPU Dependencies Audit
on:
  push:
    branches: [experiment/shortgpt-supertest-hf-oracle]
    paths: ['.github/workflows/shortgpt-upstream-cpu-dependencies.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heavyweight-shortgpt-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Clone exact original MIT ShortGPT stable revision
        run: |
          git clone -q https://github.com/RayVentura/ShortGPT.git upstream-shortgpt
          cd upstream-shortgpt
          git checkout -q 3df4e0f7a422bf7386565d498bf4521a2544c614
          test "$(git rev-parse HEAD)" = '3df4e0f7a422bf7386565d498bf4521a2544c614'
      - name: Install matching CPU-only PyTorch and torchaudio
        run: |
          python -m pip install --no-cache-dir 'torch==2.4.1+cpu' 'torchaudio==2.4.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install remaining original ShortGPT Python dependencies
        run: |
          cd upstream-shortgpt
          grep -vE '^torch$|^torchaudio$' requirements.txt > /tmp/shortgpt-cpu-requirements.txt
          python -m pip install --no-cache-dir -r /tmp/shortgpt-cpu-requirements.txt
          python -m pip install --no-deps .
          python -m pip check
      - name: Import actual ContentShortEngine and VoiceModule (no paid calls)
        run: |
          cd upstream-shortgpt
          python - <<'PY'
          from shortGPT.engine.content_short_engine import ContentShortEngine
          from shortGPT.audio.voice_module import VoiceModule
          print('UPSTREAM_FULL_SHORTGPT_CPU_IMPORT_PASS',ContentShortEngine.__name__,VoiceModule.__name__)
          PY
      - name: Save CPU dependency audit proof
        if: always()
        run: |
          python -m pip freeze > shortgpt_cpu_installed_requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-shortgpt-full-cpu-dependencies-audit
          path: shortgpt_cpu_installed_requirements.txt
          retention-days: 7

name: FastToon Open Audio - Kokoro CPU and Foley
on:
  push:
    branches: [feature/fasttoon-kokoro-rvc-sfx-wan-hybrid-20261120]
    paths:
      - 'audio-studio/**'
      - '.github/workflows/fasttoon-open-audio.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  original-foley-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q "numpy>=1.26,<3" soundfile
      - name: Create six actual CPU cartoon Foley WAV files
        run: |
          mkdir -p audio-studio/outputs
          for sound in whoosh impact pop fart sparkle footstep; do
            python audio-studio/fasttoon_audio.py sfx \
              --type "$sound" --out "audio-studio/outputs/$sound.wav"
          done
          python audio-studio/fasttoon_audio.py scene \
            --seconds 9 --timeline audio-studio/timeline_superhero_sfx.json \
            --metadata audio-studio/outputs/scene_audio.json \
            --out audio-studio/outputs/FastToon_V8_9s_OpenFoley_Soundtrack.wav
      - name: Verify sound exists and decodes correctly
        run: |
          python - <<'PY'
          import numpy as np,soundfile as sf
          x,sr=sf.read("audio-studio/outputs/FastToon_V8_9s_OpenFoley_Soundtrack.wav")
          assert sr==24000 and len(x)==216000 and x.shape[1]==2
          assert np.max(np.abs(x))>.05
          print("CPU_FOLEY_PASS",x.shape,sr)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FastToon-CPU-Original-Cartoon-Sound-Effects
          path: audio-studio/outputs/
          retention-days: 30

  kokoro-real-neural-tts-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies and CPU-only PyTorch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -q -r audio-studio/requirements-kokoro.txt
      - name: Generate actual male and female Kokoro-82M voice demos
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p audio-studio/outputs
          python audio-studio/fasttoon_audio.py tts --cpu --voice am_puck \
            --text "Look out! Don't worry! I've got you!" \
            --out audio-studio/outputs/boy_kokoro_82m.wav
          python audio-studio/fasttoon_audio.py tts --cpu --voice af_heart \
            --text "Thank you, superhero! Oh no, what is that smell?!" \
            --out audio-studio/outputs/girl_kokoro_82m.wav
          python audio-studio/fasttoon_audio.py scene \
            --seconds 9 --speech audio-studio/outputs/boy_kokoro_82m.wav \
            --out audio-studio/outputs/FastToon_Kokoro_and_Foley.wav
      - name: Verify neural voice is a non-silent WAV
        run: |
          python - <<'PY'
          import soundfile as sf,numpy as np
          for fn in ['boy_kokoro_82m.wav','girl_kokoro_82m.wav']:
            a,sr=sf.read('audio-studio/outputs/'+fn)
            assert sr==24000 and len(a)>5000
            assert np.max(np.abs(a))>.001
            print("KOKORO_CPU_INFERENCE_PASS",fn,len(a)/sr)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FastToon-Kokoro82M-Real-CPU-Voice-Demos
          path: audio-studio/outputs/
          retention-days: 30
